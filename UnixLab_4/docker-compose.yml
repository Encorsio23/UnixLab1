version: "3"
services:
  rabbitmq:
    image: "rabbitmq:3.12"
    hostname: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq

  worker:
    build: ./worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 3